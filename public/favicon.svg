<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Tactical Real-Time Command System Theme Gradients -->
    <!-- Primary: #FF4D5A | Flare: #FF7A85 | Tertiary: #B92536 | Tint: #FFCCD1 | Neutral: #08090C -->
    
    <!-- Primary Outer C Gradient (Flare -> Primary -> Tertiary) -->
    <linearGradient id="primaryColorGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FF7A85" />
      <stop offset="45%" stop-color="#FF4D5A" />
      <stop offset="100%" stop-color="#B92536" />
    </linearGradient>

    <!-- Inner C Interlocking Gradient (Tint -> Primary -> Deep Crimson) -->
    <linearGradient id="accentColorGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD1" />
      <stop offset="40%" stop-color="#FF4D5A" />
      <stop offset="100%" stop-color="#9E1222" />
    </linearGradient>

    <!-- Central Unreal Engine Diamond Core (Radiant Spark) -->
    <linearGradient id="coreDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFCCD1" />
      <stop offset="75%" stop-color="#FF4D5A" />
      <stop offset="100%" stop-color="#B92536" />
    </linearGradient>

    <!-- Tactical Crimson Bloom Filter -->
    <filter id="tacticalBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#FF4D5A" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#FF4D5A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Neutral #08090C Tactical Dark Obsidian Base -->
  <rect width="512" height="512" rx="116" fill="#08090C" />
  
  <!-- Outer Accent Neon Border in Signature Primary #FF4D5A -->
  <rect width="496" height="496" x="8" y="8" rx="110" fill="none" stroke="#FF4D5A" stroke-width="5" stroke-opacity="0.5" />
  <rect width="480" height="480" x="16" y="16" rx="102" fill="none" stroke="#C8CDD5" stroke-width="1.5" stroke-opacity="0.18" />

  <!-- Corner Tactical HUD Reticles (#FF4D5A) -->
  <path d="M 44 80 L 44 44 L 80 44" fill="none" stroke="#FF4D5A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 468 80 L 468 44 L 432 44" fill="none" stroke="#FF4D5A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 44 432 L 44 468 L 80 468" fill="none" stroke="#FF4D5A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 468 432 L 468 468 L 432 468" fill="none" stroke="#FF4D5A" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />

  <!-- Geometric CC Monogram & Unreal Engine Spatial Apex Emblem -->
  <g filter="url(#tacticalBloom)">
    <!-- Primary Outer C Arc (Chandru - Bold #FF4D5A Spectrum) -->
    <path d="M 332 148 C 300 126 262 116 220 116 C 142 116 80 178 80 256 C 80 334 142 396 220 396 C 262 396 300 386 332 364" 
          fill="none" 
          stroke="url(#primaryColorGrad)" 
          stroke-width="50" 
          stroke-linecap="round" />

    <!-- Inner Interlocking C Arc (Chandran - Radiant Prism) -->
    <path d="M 432 196 C 408 182 376 174 342 174 C 296 174 258 210 258 256 C 258 302 296 338 342 338 C 376 338 408 330 432 316" 
          fill="none" 
          stroke="url(#accentColorGrad)" 
          stroke-width="38" 
          stroke-linecap="round" />

    <!-- Central Unreal Engine 3D Apex Node -->
    <!-- Outer Deep Shadow Diamond -->
    <polygon points="256,212 294,256 256,300 218,256" fill="#B92536" opacity="0.8" />
    <!-- Vibrant Radiant Diamond -->
    <polygon points="256,216 290,256 256,296 222,256" fill="url(#coreDiamondGrad)" />
    <!-- Center Radiant Spark -->
    <polygon points="256,236 272,256 256,276 240,256" fill="#FFFFFF" />

    <!-- Horizontal Telemetry Crosshair Ticks -->
    <line x1="184" y1="256" x2="204" y2="256" stroke="#FFCCD1" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <line x1="308" y1="256" x2="328" y2="256" stroke="#FFCCD1" stroke-width="4" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
